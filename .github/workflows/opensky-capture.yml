# Capture of VIE/BTS aircraft DEPARTURES via OpenSky.
#
# OpenSky's /flights/departure only accepts a window of roughly the last hour, so
# this job must run about hourly or movements are lost for good (see the
# opensky_scraper.py docstring).
#
# IMPORTANT: GitHub's own `schedule:` trigger is best-effort. Under load it
# skips or delays runs -- measured on this repo (Aug-Oct 2026): ~1 run per 5 hours
# instead of 1 per hour. The cron below stays as a fallback, but the reliable
# trigger is an external scheduler calling `workflow_dispatch` every hour;
# see docs/OPERATIONS.md ("Reliable hourly capture").
#
# Runs at minute 7 to avoid the :00 rush when many scheduled jobs start at once.

name: Hourly OpenSky capture

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two captures at once (a late scheduled run plus an external trigger
# would otherwise double the OpenSky credit spend); a waiting run is superseded.
concurrency:
  group: opensky-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture recent movements
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: python -m scraper.opensky_scraper
