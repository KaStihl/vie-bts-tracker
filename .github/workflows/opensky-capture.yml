# Hourly capture of VIE/BTS aircraft movements via OpenSky.
# Separate from scrape.yml (weekly passenger-count scraper) because this
# needs a much more frequent schedule -- OpenSky's /flights/* endpoints only
# accept a ~1 hour historical window, so we must poll roughly hourly to avoid
# gaps (see opensky_scraper.py module docstring for details).
#
# Runs at 7 minutes past every hour (avoiding :00 sharp, when many other
# scheduled jobs across GitHub fire and queueing delays are more likely).

name: Hourly OpenSky capture

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture recent movements
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: python -m scraper.opensky_scraper
