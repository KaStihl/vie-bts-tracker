# Daily data-freshness check. Pipelines like this fail silently: a scheduled job
# that is skipped, throttled or rate-limited produces no error at all, only a
# gap in the data. This job reads Supabase and FAILS (-> GitHub e-mails the
# repo owner) when data is stale, and prints warnings for creeping problems.

name: Data health check

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check data freshness
        env:
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: python -m scraper.healthcheck
