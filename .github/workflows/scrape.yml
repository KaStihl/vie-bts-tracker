# Weekly VIE/BTS monthly traffic scrape. Writes directly to Supabase (see db.py).
# VIE and BTS only publish monthly figures once a month, so most runs just
# re-confirm known rows (the upsert is idempotent); weekly keeps the lag after a
# new release to a few days at most. Fails (non-zero exit) if a source page
# returns nothing, so a changed website layout does not go unnoticed.

name: Weekly traffic scrape

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write      # opens the draft-post issue

concurrency:
  group: traffic-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: python -m scraper.main

      # Prepares (never posts) a LinkedIn/blog draft with the newest numbers as a GitHub issue for review.
      # One issue per new release: the title names the month and the airports that have published it.
      - name: Draft LinkedIn post (issue for review)
        continue-on-error: true
        env:
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scraper.draft_post --out draft.md --title-file title.txt
          if [ -f title.txt ]; then
            title="$(cat title.txt)"
            existing="$(gh issue list --state all --limit 200 --json title --jq '.[].title' | grep -Fxc "$title" || true)"
            if [ "$existing" = "0" ]; then
              gh label create content-draft --color 0E8A16 --description "Auto-drafted LinkedIn/blog post, needs review" 2>/dev/null || true
              gh issue create --title "$title" --body-file draft.md --label content-draft
            else
              echo "Draft already exists: $title"
            fi
          fi
